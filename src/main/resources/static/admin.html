<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý - Hệ Thống Phân Loại Cà Chua</title>
    <meta name="description" content="Quản lý người dùng và vai trò hệ thống">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <div class="app-wrapper">
        <!-- Sidebar Navigation -->
        <nav class="sidebar-nav" id="sidebar-nav">
            <div class="sidebar-logo">Hệ thống phân loại cà chua</div>
            <ul class="sidebar-menu">
                <li><a href="/" id="nav-home"><span class="nav-icon">📊</span> Giám sát</a></li>
                <li id="nav-history-item" class="hidden"><a href="/history.html" id="nav-history"><span class="nav-icon">🕐</span> Lịch sử</a></li>
                <li id="nav-admin-item"><a href="/admin.html" class="active" id="nav-admin"><span
                            class="nav-icon">👥</span> Quản lý người dùng</a></li>
            </ul>
            <div class="sidebar-actions" id="sidebar-actions">
                <a href="/help.html" class="sidebar-link" id="nav-help">
                    Trợ giúp
                </a>
                <button class="sidebar-link logout" id="btn-logout">
                    Đăng xuất
                </button>
            </div>
        </nav>

        <!-- Main Area -->
        <div class="main-area">
            <!-- Top Bar -->
            <div class="top-bar">
                <button class="theme-toggle-btn" title="Chuyển đổi giao diện">
                    <span class="theme-icon-sun">☀️</span>
                    <span class="theme-icon-moon">🌙</span>
                </button>
                <div class="user-info" id="user-info">
                    <span id="user-display-name">Người dùng</span>
                    <div class="user-avatar" id="user-avatar">👤</div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <div class="page-content">

                    <!-- User Management -->
                    <div class="section-card">
                        <div class="section-card-header">
                            <h2>Quản lý người dùng</h2>
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <div class="search-bar">
                                    <input type="text" id="user-search-input" placeholder="Tìm kiếm Username..." />
                                    <button id="btn-user-search" class="btn btn-secondary btn-sm">Tìm</button>
                                </div>
                                <button id="btn-add-user" class="btn btn-outline btn-sm">Thêm người dùng mới</button>
                            </div>
                        </div>
                        <div class="table-container">
                            <table class="table" id="users-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Tên đăng nhập</th>
                                        <th>Trạng thái</th>
                                        <th>Vai trò</th>
                                        <th>Hành động</th>
                                    </tr>
                                </thead>
                                <tbody id="user-body">
                                </tbody>
                            </table>
                        </div>
                        <div class="pagination-container">
                            <button id="btn-user-prev" class="btn btn-outline btn-sm" disabled>Prev</button>
                            <span id="user-page-info">Page 1 of 1</span>
                            <button id="btn-user-next" class="btn btn-outline btn-sm" disabled>Next</button>
                        </div>
                    </div>

                    <!-- Role Management -->
                    <div class="section-card">
                        <div class="section-card-header">
                            <h2>Quản lý vai trò</h2>
                            <button id="btn-add-role" class="btn btn-outline btn-sm">Tạo vai trò mới</button>
                        </div>
                        <div class="table-container">
                            <table class="table" id="roles-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Tên vai trò</th>
                                        <th>Quyền hạn</th>
                                        <th>Hành động</th>
                                    </tr>
                                </thead>
                                <tbody id="role-body">
                                </tbody>
                            </table>
                        </div>
                        <div class="pagination-container">
                            <button id="btn-role-prev" class="btn btn-outline btn-sm" disabled>Prev</button>
                            <span id="role-page-info">Page 1 of 1</span>
                            <button id="btn-role-next" class="btn btn-outline btn-sm" disabled>Next</button>
                        </div>
                    </div>

                    <!-- User Modal -->
                    <div id="user-modal" class="modal-overlay hidden">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h3 id="user-modal-title">Thêm người dùng mới</h3>
                                <button class="modal-close" onclick="closeModal('user-modal')">&times;</button>
                            </div>
                            <form id="user-form">
                                <div class="modal-body">
                                    <div id="user-error" class="error-alert hidden"></div>
                                    <input type="hidden" id="userId" />
                                    <div class="form-group">
                                        <label for="username">Tên đăng nhập (tối thiểu 3 ký tự)</label>
                                        <input type="text" id="username" name="username" class="form-control"
                                            required />
                                    </div>
                                    <div class="form-group">
                                        <label for="password">Mật khẩu (tối thiểu 6 ký tự)</label>
                                        <input type="password" id="password" name="password" class="form-control" />
                                    </div>
                                    <div class="form-group checkbox-item">
                                        <input type="checkbox" id="enabled" name="enabled" checked />
                                        <label for="enabled">Kích hoạt tài khoản</label>
                                    </div>
                                    <div class="form-group">
                                        <label>Gán vai trò</label>
                                        <div class="checkbox-list" id="role-checkboxes"></div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary"
                                        onclick="closeModal('user-modal')">Hủy</button>
                                    <button type="submit" class="btn btn-primary">Lưu người dùng</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Role Modal -->
                    <div id="role-modal" class="modal-overlay hidden">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h3 id="role-modal-title">Tạo vai trò mới</h3>
                                <button class="modal-close" onclick="closeModal('role-modal')">&times;</button>
                            </div>
                            <form id="role-form">
                                <div class="modal-body">
                                    <div id="role-error" class="error-alert hidden"></div>
                                    <input type="hidden" id="roleId" />
                                    <div class="form-group">
                                        <label for="roleName">Tên vai trò</label>
                                        <input type="text" id="roleName" name="roleName" class="form-control"
                                            placeholder="VD: MANAGER" required />
                                    </div>
                                    <div class="form-group">
                                        <label>Gán quyền hạn</label>
                                        <div class="checkbox-list" id="permission-checkboxes"></div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary"
                                        onclick="closeModal('role-modal')">Hủy</button>
                                    <button type="submit" class="btn btn-primary">Lưu vai trò</button>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="js/utils/theme.js"></script>
    <script src="js/utils/constants.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/pages/admin.js"></script>
    <script>
        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }
    </script>
</body>

</html>
