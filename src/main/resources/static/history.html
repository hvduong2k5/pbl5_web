<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử - Hệ Thống Phân Loại Cà Chua</title>
    <meta name="description" content="Lịch sử phân loại cà chua chi tiết">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <div class="app-wrapper">
        <!-- Sidebar Navigation -->
        <nav class="sidebar-nav" id="sidebar-nav">
            <div class="sidebar-logo">Hệ thống phân loại cà chua</div>
            <ul class="sidebar-menu">
                <li><a href="/" id="nav-home"><span class="nav-icon">📊</span> Giám sát</a></li>
                <li id="nav-history-item" class="hidden"><a href="/history.html" class="active" id="nav-history"><span class="nav-icon">🕐</span> Lịch sử</a>
                </li>
                <li id="nav-admin-item" class="hidden"><a href="/admin.html" id="nav-admin"><span
                            class="nav-icon">👥</span> Quản lý người dùng</a></li>
            </ul>
            <div class="sidebar-actions" id="sidebar-actions">
                <a href="/help.html" class="sidebar-link" id="nav-help">
                    Trợ giúp
                </a>
                <button class="sidebar-link logout" id="btn-logout">
                    Đăng xuất
                </button>
            </div>
        </nav>

        <!-- Main Area -->
        <div class="main-area">
            <!-- Top Bar -->
            <div class="top-bar">
                <button class="theme-toggle-btn" title="Chuyển đổi giao diện">
                    <span class="theme-icon-sun">☀️</span>
                    <span class="theme-icon-moon">🌙</span>
                </button>
                <div class="user-info" id="user-info">
                    <span id="user-display-name">Người dùng</span>
                    <div class="user-avatar" id="user-avatar">👤</div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <div class="page-content">
                    <h1 class="page-title">Lịch Sử Phân Loại Cà Chua Chi Tiết</h1>

                    <div class="filter-bar">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <label for="batch-select">Lọc theo lô</label>
                            <select id="batch-select">
                                <option value="all">Tất cả</option>
                            </select>
                        </div>
                        <div>
                            <button id="btn-export" class="btn btn-success">
                                Xuất báo cáo Excel
                            </button>
                        </div>
                    </div>

                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Hình ảnh</th>
                                    <th>Phân loại</th>
                                    <th>Phát hiện lúc</th>
                                    <th>Phân loại lúc</th>
                                    <th>Vào hộp lúc</th>
                                    <th>Độ chính xác</th>
                                </tr>
                            </thead>
                            <tbody id="history-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/utils/theme.js"></script>
    <script src="js/utils/constants.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/pages/history.js"></script>
</body>

</html>
